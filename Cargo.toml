[package]
name = "seqtable"
version = "0.1.0"
edition = "2024"

[dependencies]
needletail = "0.5"
rayon = "1.8"
arrow = "53.0"
parquet = "53.0"
flate2 = "1.0"
ahash = "0.8"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
console = "0.15"
csv = "1.4.0"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
ahash = "0.8"

[[bench]]
name = "seqtable_bench"
harness = false

[profile.dev]
opt-level = 1
debug = true
incremental = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
strip = false
